name: Custody policy tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    name: Custody policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/.github
          ref: 2480e1fba14234582680c75146d87c44a1e48035
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_benchmark_data_policy.py -v
